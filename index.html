<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laras · 前3集</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
  #app { max-width: 440px; width: 100%; background: #222; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
  .scene { padding: 28px 24px; min-height: 520px; display: flex; flex-direction: column; }
  .ep { color: #ff6b6b; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .date { color: #888; font-size: 12px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 700; margin-bottom: 18px; }
  .text { font-size: 16.5px; line-height: 1.75; flex: 1; }
  .text p { margin: 0 0 14px 0; }
  .speaker { color: #ff8a8a; font-weight: 600; }
  .thought { color: #a0b4ff; font-style: italic; }
  button { background: #ff4d4d; color: white; border: none; padding: 16px; border-radius: 14px; font-size: 16px; cursor: pointer; margin-top: 12px; width: 100%; font-weight: 600; }
  button:hover { background: #e63939; }
  .end-screen { text-align: center; padding: 60px 20px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const episodes = [
  [
    { ep:"第1集", date:"10月21日 晚上", title:"偷看手机", 
      text:`<p>Dimas 去洗澡了。手机放在床头，屏幕还亮着。</p><p>你看了一眼浴室方向，伸手拿起来。</p><p>指纹没锁。聊天列表最上面是一个头像——红色长指甲的女人。</p><p class="thought">备注：Sari。</p>`, btn:"继续" },
    { ep:"第1集", date:"10月21日 晚上", title:"聊天记录", 
      text:`<p>你点进去。</p><p>“今晚还能出来吗？”</p><p>“她睡了就行。”</p><p>下面还有一张照片，被删了一半，只剩粉色行李箱的边。</p><p class="thought">你手指有点抖。</p>`, btn:"继续" },
    { ep:"第1集", date:"10月21日 晚上", title:"被发现", 
      text:`<p>浴室门开了。</p><p class="speaker">Dimas：</p><p>“你动我手机了？”</p><p>他看着你，语气平，眼神却冷。</p><p>你把手机放回去，没说话。</p>`, btn:"下一集" }
  ],
  [
    { ep:"第2集", date:"10月22日 下午", title:"跟踪", 
      text:`<p>你请了假，开车跟在他后面。</p><p>他停在一家咖啡馆门口。你把车停远一点。</p><p>十分钟后，一个女人出来了。粉色行李箱，红色长指甲，细手链。</p><p class="thought">Sari。</p>`, btn:"继续" },
    { ep:"第2集", date:"10月22日 下午", title:"咖啡馆", 
      text:`<p>他们坐在靠窗的位置。Sari 笑着伸手，Dimas 握住。</p><p>你在车里看着，手机没敢拍。</p><p>半小时后他们出来，一起上了车。</p>`, btn:"继续" },
    { ep:"第2集", date:"10月23日 晚上", title:"行李箱", 
      text:`<p>你回家时，客厅多了一个粉色行李箱。</p><p>Sari 已经在沙发上坐着，冲你笑：“姐，我暂时住几天。”</p><p>Dimas 在后面说：“厂里有事，她过来帮忙。”</p>`, btn:"下一集" }
  ],
  [
    { ep:"第3集", date:"10月23日 晚上", title:"同一屋檐下", 
      text:`<p>你刚进门，就看见客厅里那个粉色行李箱。</p><p>Sari 坐在沙发上，红色长指甲敲着屏幕，手腕上细手链。</p><p class="speaker">Sari：</p><p>“姐回来了？饭快好了。”</p>`, btn:"继续" },
    { ep:"第3集", date:"10月23日 晚上", title:"同款戒指", 
      text:`<p>她抬手拿杯子时，无名指上的戒指和你手上的是同款。</p><p class="thought">心里一沉。</p><p>Dimas 从厨房出来：“都在呢。”</p>`, btn:"继续" },
    { ep:"第3集", date:"10月23日 晚上", title:"指纹解锁", 
      text:`<p>吃饭前，Dimas 把手机扔在桌上。</p><p>你趁他去倒水，按了指纹。屏幕亮了。</p><p>聊天列表最上面还是 Sari。你快速退出。</p>`, btn:"继续" },
    { ep:"第3集", date:"10月23日 晚上", title:"饭桌上", 
      text:`<p class="speaker">Sari：</p><p>“哥现在是服装厂老板了，以后厂里的事就不用姐操心了。”</p><p class="thought">你低头夹菜：那是我爸的厂。</p><p>Dimas 没接话，只是给 Sari 夹了一块肉。</p>`, btn:"继续" },
    { ep:"第3集", date:"10月24日 早上", title:"两道杠", 
      text:`<p>第二天早上，卫生间里。</p><p>验孕棒放在台面上。两道杠。</p><p class="thought">不是我的。</p><p>外面传来声音：“姐，你还好吗？”</p>`, btn:"前3集结束" }
  ]
];

let epIndex = 0;
let sceneIndex = 0;
const app = document.getElementById('app');

function render() {
  if (epIndex >= episodes.length) {
    app.innerHTML = `<div class="scene end-screen"><h2>前3集已完</h2><p style="color:#aaa;margin:20px 0;">钩子：两道杠</p><p style="color:#666;">后续集数更新中</p></div>`;
    return;
  }
  const scenes = episodes[epIndex];
  if (sceneIndex >= scenes.length) {
    epIndex++;
    sceneIndex = 0;
    render();
    return;
  }
  const s = scenes[sceneIndex];
  app.innerHTML = `
    <div class="scene">
      <div class="ep">${s.ep}</div>
      <div class="date">${s.date}</div>
      <div class="title">${s.title}</div>
      <div class="text">${s.text}</div>
      <button onclick="next()">${s.btn}</button>
    </div>
  `;
}

function next() {
  sceneIndex++;
  render();
}

render();
</script>
</body>
</html>
